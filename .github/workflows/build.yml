name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/docker-crashplan-headless

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.release }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned CrashPlan version
        id: v
        run: |
          set -a; . ./versions.env; set +a
          echo "version=$CRASHPLAN_VERSION" >>"$GITHUB_OUTPUT"
          echo "build=$CRASHPLAN_BUILD" >>"$GITHUB_OUTPUT"
          echo "sha256=$CRASHPLAN_SHA256" >>"$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
          echo "release=$CRASHPLAN_VERSION-$CRASHPLAN_BUILD-r$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg SOURCE_REVISION=${{ github.sha }} \
            --build-arg SOURCE_VERSION=${{ steps.v.outputs.release }} \
            --build-arg CRASHPLAN_VERSION=${{ steps.v.outputs.version }} \
            --build-arg CRASHPLAN_BUILD=${{ steps.v.outputs.build }} \
            --build-arg CRASHPLAN_SHA256=${{ steps.v.outputs.sha256 }} \
            --label org.opencontainers.image.version=${{ steps.v.outputs.release }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t crashplan-headless:ci .

      - name: Smoke test
        run: scripts/smoke-test.sh crashplan-headless:ci

      - name: Native watcher and traversal checks
        run: |
          scripts/test-watchers.sh crashplan-headless:ci
          bash scripts/test-restore-helper.sh crashplan-headless:ci

      - name: Control and filesystem race checks
        run: |
          docker build --target control-test \
            --build-arg CRASHPLAN_VERSION=${{ steps.v.outputs.version }} \
            --build-arg CRASHPLAN_BUILD=${{ steps.v.outputs.build }} \
            --build-arg CRASHPLAN_SHA256=${{ steps.v.outputs.sha256 }} \
            -t crashplan-headless:control-test .

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RELEASE_VERSION: ${{ steps.v.outputs.release }}
        run: |
          base="${{ steps.v.outputs.version }}-${{ steps.v.outputs.build }}"
          for tag in "$RELEASE_VERSION" "$base" "$base-${{ steps.v.outputs.short }}" latest; do
            docker tag crashplan-headless:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          digest="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid published image digest" >&2
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "Published $IMAGE:$RELEASE_VERSION@$digest" >>"$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cat >"$RUNNER_TEMP/release-notes.md" <<EOF
          Image: \`$IMAGE:$RELEASE_VERSION\`

          Immutable image: \`$IMAGE@$IMAGE_DIGEST\`

          Source: $GITHUB_SHA

          CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Account-free build and startup checks passed. Account-backed scan, restore,
          retained-configuration replacement and TrueNAS acceptance require runtime testing.
          EOF
          gh release create "v$RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            --title "CrashPlan Headless $RELEASE_VERSION" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/release-notes.md"
